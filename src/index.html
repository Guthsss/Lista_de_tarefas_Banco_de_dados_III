<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicativo simples de lista de tarefas">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1 class="titulo-lista">Lista de Tarefas</h1>
    </header>

    <main>
        <section class="inserir">
            <h3>
                <label for="campo-texto">Insira sua tarefa no campo abaixo:</label>
            </h3>

            <input
                type="text"
                id="campo-texto"
                class="campo-texto"
                placeholder="Insira sua tarefa"
                onkeydown="if (event.key === 'Enter') adicionarTarefa()"
            >

            <button
                type="button"
                id="botao-adicionar"
                class="botao-adicionar"
                onclick="adicionarTarefa()"
            >
                Inserir
            </button>

            <ul class="lista-tarefas"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; Lista de Tarefas (Gregory, Luiz, Henrique) 2026</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
